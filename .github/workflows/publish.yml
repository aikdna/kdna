name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-core:
    if: >-
      github.repository == 'aikdna/kdna' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      !startsWith(github.event.release.tag_name, 'v') &&
      !contains(github.event.release.tag_name, '/')
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Select the outside-repository trusted npm release
        run: |
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - name: Fetch and authenticate the audited npm release bytes
        run: >-
          node scripts/core-release-authority.js provision-npm
          --artifact "$RUNNER_TEMP/npm-11.17.0.tgz"
      - name: Verify the isolated npm CLI and extraction boundary
        run: node scripts/core-release-authority.js verify-npm
      - run: node scripts/core-release-authority.js trusted-npm ci --ignore-scripts
      - name: Verify exact natural SemVer tag and authoritative source
        run: node scripts/core-release-authority.js check
      - name: Test Core and hostile release policy
        run: |
          node scripts/core-release-authority.js trusted-npm --workspace @aikdna/kdna-core test
          node --test scripts/core-release-authority.test.js
      - name: Validate authoritative Runtime manifest fixtures
        run: node scripts/core-release-authority.js trusted-npm run validate:protocol-fixtures
      - name: Validate published Runtime contract surfaces
        run: node scripts/core-release-authority.js trusted-npm run validate:runtime-contract
      - run: node scripts/core-release-authority.js trusted-npm run conformance
      - name: Select outside-repository release outputs
        run: |
          CORE_VERSION=$(node -p "require('./packages/kdna-core/package.json').version")
          echo "CORE_RELEASE_EVIDENCE=$RUNNER_TEMP/kdna-core-release-evidence.json" >> "$GITHUB_ENV"
          echo "CORE_RELEASE_ARTIFACT=$RUNNER_TEMP/aikdna-kdna-core-$CORE_VERSION.tgz" >> "$GITHUB_ENV"
      - name: Build two exact-commit packs and retain the verified first artifact
        run: >-
          node scripts/core-release-authority.js prepare
          --evidence "$CORE_RELEASE_EVIDENCE"
          --artifact "$CORE_RELEASE_ARTIFACT"
      - name: Verify the retained artifact through a clean install
        run: >-
          node scripts/core-release-authority.js smoke
          --evidence "$CORE_RELEASE_EVIDENCE"
          --artifact "$CORE_RELEASE_ARTIFACT"
      - name: Guard duplicate Core publication
        id: registry
        run: >-
          node scripts/core-release-authority.js guard
          --evidence "$CORE_RELEASE_EVIDENCE"
          --artifact "$CORE_RELEASE_ARTIFACT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-core-release-evidence
          path: |
            ${{ env.CORE_RELEASE_EVIDENCE }}
            ${{ env.CORE_RELEASE_ARTIFACT }}
      - name: Publish the rebound retained Core artifact
        if: steps.registry.outputs.should_publish == 'true'
        run: >-
          node scripts/core-release-authority.js publish
          --evidence "$CORE_RELEASE_EVIDENCE"
          --artifact "$CORE_RELEASE_ARTIFACT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Remove transient Core release outputs
        if: always()
        run: >-
          rm -f "$CORE_RELEASE_EVIDENCE" "$CORE_RELEASE_ARTIFACT"
          "$KDNA_TRUSTED_NPM_TARBALL"

  publish-eval:
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'eval/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Verify exact eval tag and source commit
        run: npm --workspace @aikdna/kdna-eval run release:check
      - run: npm --workspace @aikdna/kdna-eval test
      - run: npm --workspace @aikdna/kdna-eval run typecheck
      - name: Build and retain the exact Eval package artifact
        run: npm run release:evidence -- --package=eval
      - name: Verify eval release evidence
        run: npm --workspace @aikdna/kdna-eval run release:evidence:check
      - name: Select the verified Eval artifact
        run: |
          ARTIFACT_PATH=$(node -p "require('./release-evidence/artifact-manifest.json').artifacts[0].artifact_path")
          echo "EVAL_RELEASE_ARTIFACT=$ARTIFACT_PATH" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-eval-release-evidence
          path: release-evidence/
      - name: Publish @aikdna/kdna-eval
        run: |
          VERSION=$(node -p "require('./packages/kdna-eval/package.json').version")
          if npm view "@aikdna/kdna-eval@$VERSION" version >/dev/null 2>&1; then
            echo "@aikdna/kdna-eval@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish "./$EVAL_RELEASE_ARTIFACT" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-conformance:
    if: >-
      github.repository == 'aikdna/kdna' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'conformance/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Verify exact conformance tag and source commit
        run: npm --workspace @aikdna/kdna-conformance run release:check
      - run: npm --workspace @aikdna/kdna-conformance test
      - run: npm --workspace @aikdna/kdna-conformance run conformance
      - name: Build and retain the exact Conformance package artifact
        run: npm run release:evidence -- --package=conformance
      - name: Verify conformance release evidence
        run: npm --workspace @aikdna/kdna-conformance run release:evidence:check
      - name: Select the verified Conformance artifact
        run: |
          ARTIFACT_PATH=$(node -p "require('./release-evidence/artifact-manifest.json').artifacts[0].artifact_path")
          echo "CONFORMANCE_RELEASE_ARTIFACT=$ARTIFACT_PATH" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-conformance-release-evidence
          path: release-evidence/
      - name: Publish @aikdna/kdna-conformance
        run: |
          VERSION=$(node -p "require('./packages/kdna-conformance/package.json').version")
          if npm view "@aikdna/kdna-conformance@$VERSION" version >/dev/null 2>&1; then
            echo "@aikdna/kdna-conformance@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish "./$CONFORMANCE_RELEASE_ARTIFACT" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-read:
    if: >-
      github.repository == 'aikdna/kdna' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'read/')
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Select the outside-repository trusted npm release
        run: |
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - name: Fetch and authenticate the audited npm release bytes
        run: >-
          node scripts/core-release-authority.js provision-npm
          --artifact "$RUNNER_TEMP/npm-11.17.0.tgz"
      - name: Verify the isolated npm CLI and extraction boundary
        run: node scripts/core-release-authority.js verify-npm
      - run: node scripts/core-release-authority.js trusted-npm ci --ignore-scripts
      - name: Verify exact read tag and source commit
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna-read run release:check
      - run: node scripts/core-release-authority.js trusted-npm --workspace @aikdna/kdna-read test
      - name: Build and retain the exact Read package artifact
        run: node scripts/core-release-authority.js trusted-npm run release:evidence -- --package=read
      - name: Verify read release evidence
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna-read run release:evidence:check
      - name: Select the verified Read artifact
        run: |
          ARTIFACT_PATH=$(node -p "require('./release-evidence/artifact-manifest.json').artifacts[0].artifact_path")
          echo "READ_RELEASE_ARTIFACT=$ARTIFACT_PATH" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-read-release-evidence
          path: release-evidence/
      - name: Publish @aikdna/kdna-read
        run: |
          VERSION=$(node -p "require('./packages/kdna-read/package.json').version")
          if npm view "@aikdna/kdna-read@$VERSION" version >/dev/null 2>&1; then
            echo "@aikdna/kdna-read@$VERSION is already published; skipping."
            exit 0
          fi
          node scripts/core-release-authority.js trusted-npm-auth publish "./$READ_RELEASE_ARTIFACT" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Remove transient Read release outputs
        if: always()
        run: >-
          rm -f "$KDNA_TRUSTED_NPM_TARBALL"

  publish-compat:
    if: >-
      github.repository == 'aikdna/kdna' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'compat/')
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-cli
          ref: 513a6a08ca26877281c35df267ec210fba1140ec
          path: .ecosystem-repos/kdna-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-skills
          ref: 9c3fa00128d87a7146e353c9cfde202a5f391f99
          path: .ecosystem-repos/kdna-skills
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-core
          ref: bfcf09eac8732b67d612d970764a27df27247180
          path: .ecosystem-repos/kdna-studio-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-cli
          ref: e0caf6de1a7dec39b5b7be6bc5292d67750515ce
          path: .ecosystem-repos/kdna-studio-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-core-swift
          ref: c1f8495db5e5c094458ff62c295e28cd760fb166
          path: .ecosystem-repos/kdna-core-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-app-shared
          ref: 017e759efb448bf99b3384ccafa7f25172169ebb
          path: .ecosystem-repos/kdna-app-shared
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-swift
          ref: c784a1262b2481ba4504548feac2bb782f5d70e5
          path: .ecosystem-repos/kdna-studio-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-assets
          ref: 4de5bb01f4216624e57ffa7ac901e982dd323d95
          path: .ecosystem-repos/kdna-assets
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select the outside-repository trusted npm release
        run: |
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - name: Fetch and authenticate the audited npm release bytes
        run: >-
          node scripts/core-release-authority.js provision-npm
          --artifact "$RUNNER_TEMP/npm-11.17.0.tgz"
      - name: Verify the isolated npm CLI and extraction boundary
        run: node scripts/core-release-authority.js verify-npm
      - run: node scripts/core-release-authority.js trusted-npm ci --ignore-scripts
      - name: Install fixed Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.1.0 cbor2==6.1.4 jsonschema==4.26.0 cryptography==50.0.0 argon2-cffi==25.1.0
      - name: Fetch protected main for release ancestry verification
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
      - name: Verify canonical compatibility release tag
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna run release:check
      - name: Verify all expected ecosystem dependency bindings
        env:
          KDNA_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
          KDNA_CONTROL_ROOT: ${{ github.workspace }}
          KDNA_CLI_BASELINE: '0.36.0'
          KDNA_CORE_BASELINE: '0.21.0'
          KDNA_STUDIO_CORE_BASELINE: '3.0.0'
        run: >-
          node scripts/core-release-authority.js trusted-npm
          run test:ecosystem-lock
      - name: Run the complete ecosystem gate
        env:
          KDNA_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: node scripts/core-release-authority.js trusted-npm run ecosystem-gate
      - name: Build independently verified compatibility artifact
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna run release:pack --
          --evidence "$RUNNER_TEMP/kdna-compat-release-evidence.json"
          --artifact "$RUNNER_TEMP/kdna-compat-release.tgz"
      - name: Verify exact tarball through a clean registry install
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna run release:smoke --
          --artifact "$RUNNER_TEMP/kdna-compat-release.tgz"
      - name: Guard duplicate compatibility publication
        id: registry
        run: >-
          node scripts/core-release-authority.js trusted-npm
          --workspace @aikdna/kdna run publish:guard --
          --evidence "$RUNNER_TEMP/kdna-compat-release-evidence.json"
          --artifact "$RUNNER_TEMP/kdna-compat-release.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-compat-release-evidence
          path: |
            ${{ runner.temp }}/kdna-compat-release-evidence.json
            ${{ runner.temp }}/kdna-compat-release.tgz
      - name: Publish the verified compatibility package
        if: steps.registry.outputs.should_publish == 'true'
        run: >-
          node scripts/core-release-authority.js trusted-npm-auth
          --workspace @aikdna/kdna run publish:verified --
          --evidence "$RUNNER_TEMP/kdna-compat-release-evidence.json"
          --artifact "$RUNNER_TEMP/kdna-compat-release.tgz"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Remove transient compatibility artifacts
        if: always()
        run: >-
          rm -f "$RUNNER_TEMP/kdna-compat-release-evidence.json"
          "$RUNNER_TEMP/kdna-compat-release.tgz"
          "$KDNA_TRUSTED_NPM_TARBALL"

  python-source-artifacts:
    # Python is a separately scoped source candidate. This job never publishes
    # to PyPI; stable Python publication has no enabled route in this workflow.
    if: >-
      github.repository == 'aikdna/kdna' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == true &&
      startsWith(github.event.release.tag_name, 'python/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bind the genuine source prerelease tag to Python metadata
        run: |
          python -I -B - <<'PYTHON'
          import os, subprocess, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('python-sdk/pyproject.toml').read_text())['project']
          tag = 'python/' + project['version']
          assert project['version'] == '0.8.0rc2'
          assert os.environ['RELEASE_TAG_NAME'] == tag
          assert os.environ['GITHUB_REF'] == 'refs/tags/' + tag
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip() == head
          assert os.environ['GITHUB_SHA'] == head
          PYTHON
      - name: Build unsigned source candidate and verify archive identities
        run: python -I -B python-sdk/scripts/build-source-distribution.py --output "$RUNNER_TEMP/python-source-dist"
      - name: Install the wheel and source archive into separate cold environments
        run: |
          for kind in wheel sdist; do
            python -m venv "$RUNNER_TEMP/python-$kind"
            artifact="$RUNNER_TEMP/python-source-dist/aikdna-0.8.0rc2-py3-none-any.whl"
            if [ "$kind" = sdist ]; then artifact="$RUNNER_TEMP/python-source-dist/aikdna-0.8.0rc2.tar.gz"; fi
            "$RUNNER_TEMP/python-$kind/bin/python" -m pip install --no-index --no-deps --no-build-isolation --no-cache-dir "$artifact"
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/python-$kind/bin/python" -I -B -m unittest discover -s "$GITHUB_WORKSPACE/python-sdk/tests" -p 'test_*.py' -v
            cd "$GITHUB_WORKSPACE"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aikdna-python-source-candidate
          path: ${{ runner.temp }}/python-source-dist/
          if-no-files-found: error
