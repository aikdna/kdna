name: core-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    name: core-smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/create-kdna-web-app
          ref: fbdfc3d16675f728d5df3d7446d22c6637f3afd8
          path: .ecosystem-repos/create-kdna-web-app
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-activation-server
          ref: 38b31ba237b23c6dd7171a5aafa7c4032a3d8807
          path: .ecosystem-repos/kdna-activation-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-app-shared
          ref: b9aab4ff6f505c8e3faceba56c2a9c95a3e88ba2
          path: .ecosystem-repos/kdna-app-shared
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-assets
          ref: 418b98bb3bc21a6cdc792953474ee5356aa20984
          path: .ecosystem-repos/kdna-assets
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-cli
          ref: 2adb6d403802e2ba6b9923258959c2179e05e32c
          path: .ecosystem-repos/kdna-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-core-swift
          ref: 0b85375b7e92b9ca4591f92c1e814018a4fb95b8
          path: .ecosystem-repos/kdna-core-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-demo-web-viewer
          ref: 1bda8851ff8a2cb5fb1d399df19cf7d0fdc0628d
          path: .ecosystem-repos/kdna-demo-web-viewer
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-react
          ref: 5480640d0e62afc3baf891e66e07c89cae04a488
          path: .ecosystem-repos/kdna-react
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-remote-server
          ref: c2813087e7e47d6f8848a4281c87612439d6dd4a
          path: .ecosystem-repos/kdna-remote-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-skills
          ref: 40e50578178b72c400bb5b90a3ed76eef8176693
          path: .ecosystem-repos/kdna-skills
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-cli
          ref: 8daecf1ab47e472cd154c5f1e42273b2d59667cd
          path: .ecosystem-repos/kdna-studio-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-core
          ref: 232b59099590d64affaed09aaa51146ad475a246
          path: .ecosystem-repos/kdna-studio-core
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-swift
          ref: 10d33fd502449ad93d99eb5670e1da4015b0a15a
          path: .ecosystem-repos/kdna-studio-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-web-client
          ref: 01fe619468540acbaa7929b78b612c90268511cc
          path: .ecosystem-repos/kdna-web-client
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-web-server
          ref: c1b0d1de6d23e2d642efb0ed31a16887627afce7
          path: .ecosystem-repos/kdna-web-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This frozen editor input is used only by historical compatibility validation.
          repository: aikdna/kdna-vscode
          ref: f5629f664efc098916f9576c4d3652a62c994bd4
          path: .ecosystem-repos/kdna-vscode
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Select the outside-repository trusted npm release
        run: |
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - name: Fetch and authenticate the audited npm release bytes
        run: >-
          node scripts/core-release-authority.js provision-npm
          --artifact "$RUNNER_TEMP/npm-11.17.0.tgz"
      - name: Verify the isolated npm CLI and extraction boundary
        run: node scripts/core-release-authority.js verify-npm
      - name: Install workspace deps
        run: node scripts/core-release-authority.js trusted-npm ci --ignore-scripts
      - name: Verify integration policy counterexamples on macOS
        run: node scripts/core-release-authority.js trusted-npm run test:integration-policy
      - name: Install fixed Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.1.0 cbor2==6.1.4 jsonschema==4.26.0 cryptography==50.0.0 argon2-cffi==25.1.0
      - name: Verify Python execution and receipt counterexamples
        run: python -I scripts/run-source-pytest.test.py
      - name: Materialize accepted historical compatibility inputs
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
        run: >-
          node scripts/prepare-compatibility-repos.js
          --destination "${{ runner.temp }}/accepted-compatibility"
      - name: Verify accepted release manifest and all historical dependency bindings
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_CONTROL_ROOT: ${{ github.workspace }}
        run: |
          node scripts/validate-ecosystem-manifest.js
          node scripts/ecosystem-version-lock.js --strict
      - name: Verify current sources, actual packs, child CI and root execution
        env:
          KDNA_SOURCE_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
          KDNA_PYTHON: ${{ env.pythonLocation }}/bin/python
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ecosystem-source-gate.js
          --work-dir "${{ runner.temp }}/current-source-result"
      - name: Show current source report on failure
        if: failure()
        run: |
          if test -f "${{ runner.temp }}/current-source-result/source-gate.json"; then
            cat "${{ runner.temp }}/current-source-result/source-gate.json"
          fi
      - name: Remove the trusted npm release bytes
        if: always()
        run: rm -f "$KDNA_TRUSTED_NPM_TARBALL"
