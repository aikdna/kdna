name: core-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Select the current run source or the frozen stable release source'
        type: choice
        required: true
        default: current
        options:
          - current
          - '40aa4d8d70f2f0735069063f0b609bdef88e29b4'

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  smoke:
    name: core-smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref == '40aa4d8d70f2f0735069063f0b609bdef88e29b4' && '40aa4d8d70f2f0735069063f0b609bdef88e29b4' || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-app-shared
          ref: b9aab4ff6f505c8e3faceba56c2a9c95a3e88ba2
          path: .ecosystem-repos/kdna-app-shared
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-assets
          ref: 57b7661fbf525f28272b7fa79bb86fc482877180
          path: .ecosystem-repos/kdna-assets
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-cli
          ref: 2adb6d403802e2ba6b9923258959c2179e05e32c
          path: .ecosystem-repos/kdna-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-core-swift
          ref: 0b85375b7e92b9ca4591f92c1e814018a4fb95b8
          path: .ecosystem-repos/kdna-core-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-skills
          ref: 40e50578178b72c400bb5b90a3ed76eef8176693
          path: .ecosystem-repos/kdna-skills
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-cli
          ref: 8daecf1ab47e472cd154c5f1e42273b2d59667cd
          path: .ecosystem-repos/kdna-studio-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-core
          ref: 232b59099590d64affaed09aaa51146ad475a246
          path: .ecosystem-repos/kdna-studio-core
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-swift
          ref: 10d33fd502449ad93d99eb5670e1da4015b0a15a
          path: .ecosystem-repos/kdna-studio-swift
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Select the outside-repository trusted npm release
        run: |
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - name: Fetch and authenticate the audited npm release bytes
        run: >-
          node scripts/core-release-authority.js provision-npm
          --artifact "$RUNNER_TEMP/npm-11.17.0.tgz"
      - name: Verify the isolated npm CLI and extraction boundary
        run: node scripts/core-release-authority.js verify-npm
      - name: Install workspace deps
        run: node scripts/core-release-authority.js trusted-npm ci --ignore-scripts
      - name: Verify integration policy counterexamples on macOS
        run: node scripts/core-release-authority.js trusted-npm run test:integration-policy
      - name: Install fixed Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.1.0 cbor2==6.1.4 jsonschema==4.26.0 cryptography==50.0.0 argon2-cffi==25.1.0
      - name: Verify Python execution and receipt counterexamples
        run: python -I scripts/run-source-pytest.test.py
      - name: Materialize accepted historical compatibility inputs
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
        run: >-
          node scripts/prepare-compatibility-repos.js
          --destination "${{ runner.temp }}/accepted-compatibility"
      - name: Verify accepted release manifest and all historical dependency bindings
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_CONTROL_ROOT: ${{ github.workspace }}
        run: |
          node scripts/validate-ecosystem-manifest.js
          node scripts/ecosystem-version-lock.js --strict --historical-root-package-inputs
      - name: Verify current sources, actual packs, child CI and root execution
        env:
          KDNA_SOURCE_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
          KDNA_PYTHON: ${{ env.pythonLocation }}/bin/python
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ecosystem-source-gate.js
          --work-dir "${{ runner.temp }}/current-source-result"
      - name: Show current source report on failure
        if: failure()
        run: |
          if test -f "${{ runner.temp }}/current-source-result/source-gate.json"; then
            cat "${{ runner.temp }}/current-source-result/source-gate.json"
          fi
      - name: Retain original current source evidence
        if: always()
        env:
          R1_PRIOR_JOB_STATUS: ${{ job.status }}
          R1_REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python - --source-root "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/current-source-result" --output-dir "$RUNNER_TEMP/current-source-retention" <<'PY_SOURCE_RETENTION'
          #!/usr/bin/env python3
          """Retain original source-gate files; never run a gate or query a service."""
          import argparse
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import tarfile

          GATE_FILES = (
              "source-gate.json", "root-run-test:core-smoke.log", "root-test.log",
              "root-run-validate:examples.log", "root-audit---audit-level=high.log",
              "root-python.log", "root-python.json", "root-python.xml",
              "root-python-execution.json", "root-pytest.ini",
          )
          SOURCE_FILES = (
              ".github/workflows/core-smoke.yml", ".github/workflows/publish.yml",
              "scripts/ecosystem-source-gate.js", "scripts/ecosystem-source-ci.js",
              "scripts/ecosystem-source-inventory.json", "scripts/run-source-pytest.py",
          )


          def sha(data):
              return hashlib.sha256(data).hexdigest()


          def regular(root, relative):
              current = root
              for part in Path(relative).parts:
                  current = current / part
                  if current.is_symlink():
                      raise ValueError("symbolic link in retained file path")
              info = current.stat()
              if not stat.S_ISREG(info.st_mode) or info.st_size > 256 * 1024 * 1024:
                  raise ValueError("retained input must be a bounded regular file")
              return current.read_bytes(), stat.S_IMODE(info.st_mode)


          def git(root, *args):
              result = subprocess.run(["git", "-C", str(root), *args],
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                      check=False, timeout=30)
              if result.returncode:
                  return None
              return result.stdout.decode("utf-8").strip()


          def collect(source, work, output):
              source, work = source.resolve(), work.resolve()
              output = output.absolute()
              parent = output.parent.resolve(strict=True)
              output = parent / output.name
              if output == source or source in output.parents or output == work or work in output.parents:
                  raise ValueError("retention output must be separate from source and gate directories")
              output.mkdir(mode=0o700)  # Never reuse a previous run's receipts.
              context = {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "event": os.environ.get("GITHUB_EVENT_NAME"),
                  "requested_source_ref": os.environ.get("R1_REQUESTED_SOURCE_REF"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "job": os.environ.get("GITHUB_JOB"),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "event_sha": os.environ.get("GITHUB_SHA"),
                  "workflow_definition_commit": os.environ.get("GITHUB_WORKFLOW_SHA"),
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
                  "prior_job_status": os.environ.get("R1_PRIOR_JOB_STATUS"),
                  "tested_source": {
                      "commit": git(source, "rev-parse", "HEAD"),
                      "tree": git(source, "rev-parse", "HEAD^{tree}"),
                      "tracked_changes": git(source, "diff", "--name-only", "HEAD"),
                  },
              }
              entries, missing, rejected = [], [], []
              payload = {}
              for prefix, root, names in (("gate", work, GATE_FILES), ("source", source, SOURCE_FILES)):
                  for name in names:
                      target = prefix + "/" + name
                      try:
                          data, mode = regular(root, name)
                          payload[target] = (data, mode)
                      except FileNotFoundError:
                          missing.append(target)
                      except (OSError, ValueError):
                          rejected.append(target)
              context_bytes = (json.dumps(context, indent=2) + "\n").encode()
              payload["context.json"] = (context_bytes, 0o600)
              with tarfile.open(output / "source-evidence.tar", "x", format=tarfile.PAX_FORMAT) as archive:
                  for name, (data, mode) in sorted(payload.items()):
                      item = tarfile.TarInfo(name)
                      item.size, item.mode, item.mtime = len(data), mode, 0
                      archive.addfile(item, io.BytesIO(data))
                      entries.append({"path": name, "bytes": len(data), "sha256": sha(data), "mode": mode})
              report = {
                  "schema": "kdna-source-evidence-retention/1",
                  "status": "RETAINED_COMPLETE_FILES" if not missing and not rejected else "RETAINED_INCOMPLETE_FILES",
                  "context": context, "files": entries, "missing": missing, "rejected": rejected,
                  "archive": {"path": "source-evidence.tar", "sha256": sha((output / "source-evidence.tar").read_bytes()),
                              "bytes": (output / "source-evidence.tar").stat().st_size},
                  "scope": "Original report/root logs/Python receipts and source identities only; no gate execution or acceptance.",
                  "excludes": ["pack directories", "dependency installs", "environment dump", "credentials"],
              }
              (output / "retention.json").write_text(json.dumps(report, indent=2) + "\n")
              print(json.dumps({"status": report["status"], "files": len(entries), "missing": missing, "rejected": rejected}))


          if __name__ == "__main__":
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--source-root", type=Path, required=True)
              parser.add_argument("--work-dir", type=Path, required=True)
              parser.add_argument("--output-dir", type=Path, required=True)
              args = parser.parse_args()
              collect(args.source_root, args.work_dir, args.output_dir)
          PY_SOURCE_RETENTION
      - name: Upload original current source evidence
        id: source_evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdna-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-source-retention/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record uploaded source evidence identity
        if: always() && steps.source_evidence_upload.outcome == 'success'
        env:
          R1_ARTIFACT_ID: ${{ steps.source_evidence_upload.outputs.artifact-id }}
          R1_ARTIFACT_DIGEST: ${{ steps.source_evidence_upload.outputs.artifact-digest }}
        run: |
          python - <<'PY_SOURCE_UPLOAD'
          import json, os
          receipt = {"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                     "artifact_id": os.environ["R1_ARTIFACT_ID"], "artifact_digest": os.environ["R1_ARTIFACT_DIGEST"]}
          print("R1_ARTIFACT_RECEIPT_JSON=" + json.dumps(receipt, separators=(",", ":")))
          PY_SOURCE_UPLOAD
      - name: Remove the trusted npm release bytes
        if: always()
        run: rm -f "$KDNA_TRUSTED_NPM_TARBALL"
