name: Docs CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-ci.js'
      - 'scripts/check-publish-drift.js'
      - 'scripts/ecosystem-manifest.js'
      - 'scripts/historical-root-package-evidence.js'
      - 'scripts/historical-root-package-evidence.json'
      - 'ecosystem-manifest.json'
      - 'schema/ecosystem-manifest.schema.json'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-ci.js'
      - 'scripts/check-publish-drift.js'
      - 'scripts/ecosystem-manifest.js'
      - 'scripts/historical-root-package-evidence.js'
      - 'scripts/historical-root-package-evidence.json'
      - 'ecosystem-manifest.json'
      - 'schema/ecosystem-manifest.schema.json'
      - '.github/workflows/docs-ci.yml'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Run docs evidence checks
        run: node scripts/docs-ci.js
      - name: Run npm publish drift check
        run: node scripts/check-publish-drift.js
