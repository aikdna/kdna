# publish-health-cron.yml — Daily drift check for the npm pipeline.
#
# Verifies that for every tracked package, the public release surfaces agree:
#   1. main HEAD version (from package.json on main)
#   2. npm latest version and SLSA provenance
#   3. exact canonical package tag (or one version-bound historical coordinate)
#   4. package.json version at the tagged commit
#   5. npm gitHead binding when the registry exposes it
#   6. published, non-prerelease GitHub Release existence
#
# Delegates the public package audit to scripts/publish-health.mjs and keeps
# ecosystem-version-lock plus validate-public-truth as independent gates.
#
# On drift detection, fails the job so a notification can be wired up
# (e.g. via the repository's notification settings / Slack webhook).

name: publish-health-cron

on:
  schedule:
    - cron: '0 9 * * *'  # Daily 09:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # need full history for tag/branch resolution

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      # Frozen ecosystem siblings: the version lock reads them from the manifest, so the
      # public surfaces can be compared against the exact accepted coordinates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-cli
          ref: 7f609d5a30e00ddcf2cd418699fb6390d80ed78e
          path: .ecosystem-repos/kdna-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-assets
          ref: 4de5bb01f4216624e57ffa7ac901e982dd323d95
          path: .ecosystem-repos/kdna-assets
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-skills
          ref: 9c3fa00128d87a7146e353c9cfde202a5f391f99
          path: .ecosystem-repos/kdna-skills
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-core
          ref: b315ac7a0142ba594649eb764c525ba752a21e12
          path: .ecosystem-repos/kdna-studio-core
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-cli
          ref: c0fc93759d245fb1700849f5783822f3b4268ebf
          path: .ecosystem-repos/kdna-studio-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-activation-server
          ref: 31b76fabc5d3f487221a7ea862f352cf190fa825
          path: .ecosystem-repos/kdna-activation-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-remote-server
          ref: 81b563598ecc19da480d5191f9554a20cef19744
          path: .ecosystem-repos/kdna-remote-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-web-server
          ref: f4907a9786f82f13e62db1040690a5f7df8f512b
          path: .ecosystem-repos/kdna-web-server
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-web-client
          ref: f86d46255b7a4e93b40700741de9e0ddcb6bb812
          path: .ecosystem-repos/kdna-web-client
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-react
          ref: 1c55b6539aa13604acaff589016d7cbc218f05b0
          path: .ecosystem-repos/kdna-react
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/create-kdna-web-app
          ref: a7f414d1a7a6e1bd88fd61ee9d8ace49ba5c8c39
          path: .ecosystem-repos/create-kdna-web-app
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-demo-web-viewer
          ref: f2bb5459229c44fe0c8ef0294602797e6c9fd7e2
          path: .ecosystem-repos/kdna-demo-web-viewer
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-core-swift
          ref: c1f8495db5e5c094458ff62c295e28cd760fb166
          path: .ecosystem-repos/kdna-core-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-app-shared
          ref: 017e759efb448bf99b3384ccafa7f25172169ebb
          path: .ecosystem-repos/kdna-app-shared
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-studio-swift
          ref: c784a1262b2481ba4504548feac2bb782f5d70e5
          path: .ecosystem-repos/kdna-studio-swift
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aikdna/kdna-vscode
          ref: f5629f664efc098916f9576c4d3652a62c994bd4
          path: .ecosystem-repos/kdna-vscode
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Materialize accepted historical compatibility inputs
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ github.workspace }}/.ecosystem-repos
        run: >-
          node scripts/prepare-compatibility-repos.js
          --destination "${{ runner.temp }}/accepted-compatibility"

      - name: Run ecosystem version lock check
        id: lock
        env:
          KDNA_ECOSYSTEM_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_REPOS_ROOT: ${{ runner.temp }}/accepted-compatibility
          KDNA_CONTROL_ROOT: ${{ github.workspace }}
        run: |
          node scripts/validate-ecosystem-manifest.js
          node scripts/ecosystem-version-lock.js --strict
        continue-on-error: true

      - name: Run validate-public-truth
        id: truth
        run: node scripts/validate-public-truth.js
        continue-on-error: true

      - name: Run publish-health (all tracked npm packages)
        id: cross
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/publish-health.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Summarize results
        if: always()
        run: |
          echo "## publish-health-cron results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ecosystem-version-lock: ${{ steps.lock.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- validate-public-truth: ${{ steps.truth.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- cross-package check: ${{ steps.cross.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any check failed
        if: steps.lock.outcome == 'failure' || steps.truth.outcome == 'failure' || steps.cross.outcome == 'failure'
        run: |
          echo "::error::One or more drift checks failed. See summary."
          exit 1
