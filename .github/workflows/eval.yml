name: KDNA Eval

on:
  push:
    branches: [main]
    paths: ['.github/workflows/eval.yml', 'conformance/**', 'examples/**', 'packages/**', 'schema/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/eval.yml', 'conformance/**', 'examples/**', 'packages/**', 'schema/**', 'scripts/**']

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22' }

      - run: npm ci

      - name: Run deterministic protocol preflight
        run: npm run release:preflight
